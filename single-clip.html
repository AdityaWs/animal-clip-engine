<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single Clip &mdash; Animal Clip Engine</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo">AC</div>
    <div>
      <h1>Single Clip</h1>
      <div class="sub">program-single-clip.py</div>
    </div>
  </header>

  <main>
    <a class="back" href="/">&larr; Kembali</a>

    <form id="singleForm" enctype="multipart/form-data">
      <section class="panel">
        <h2>1. Video Sumber</h2>
        <p class="desc">Upload satu video. Seluruh durasi dipakai &mdash; tanpa potongan.</p>
        <label class="drop" id="dropZone">
          <span class="big">Klik atau tarik video ke sini</span>
          <span class="hint">MP4, MOV, MKV, dll.</span>
          <div class="fname" id="fname"></div>
          <input type="file" id="video" name="video" accept="video/*">
        </label>
      </section>

      <section class="panel">
        <h2>2. Judul</h2>
        <p class="desc">Teks judul kuning yang di-render di atas frame. Mode otomatis: landscape&rarr;contain, portrait/square&rarr;cover.</p>
        <label for="title">Judul</label>
        <input type="text" id="title" name="title" placeholder="Best Moments" required>
      </section>

      <section class="panel">
        <h2>3. Opsi Output</h2>
        <div class="row">
          <div>
            <label for="output">Nama file output</label>
            <input type="text" id="output" name="output" value="single.mp4" placeholder="single.mp4">
          </div>
          <div>
            <label for="y">Posisi Y judul (mode cover)</label>
            <input type="number" id="y" name="y" value="60" step="1">
          </div>
        </div>
      </section>

      <button type="submit" class="btn-primary btn-block" id="submitBtn">Proses &amp; Render</button>
    </form>

    <div class="status" id="status"></div>
    <div class="log" id="log"></div>
    <div class="download-box" id="downloadBox" style="display:none;">
      <a id="downloadLink" href="#">Download Video Hasil</a>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const drop = $("dropZone");
    const fileInput = $("video");
    drop.addEventListener("click", () => fileInput.click());
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("drag");
      if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        showFile();
      }
    });
    fileInput.addEventListener("change", showFile);
    function showFile() {
      $("fname").textContent = fileInput.files[0] ? "File: " + fileInput.files[0].name + " (" + (fileInput.files[0].size / (1024*1024)).toFixed(1) + " MB)" : "";
    }

    const status = $("status"), log = $("log");
    function setStatus(msg, kind) {
      status.className = "status show " + kind;
      status.textContent = msg;
    }

    $("singleForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      status.className = "status";
      log.className = "log";
      $("downloadBox").style.display = "none";

      if (!fileInput.files.length) { return setStatus("Pilih video dulu.", "error"); }
      if (!$("title").value.trim()) { return setStatus("Isi judul dulu.", "error"); }

      const fd = new FormData();
      fd.append("video", fileInput.files[0]);
      fd.append("title", $("title").value.trim());
      fd.append("output", $("output").value.trim() || "single.mp4");
      fd.append("y", $("y").value || "60");

      $("submitBtn").disabled = true;
      setStatus("Mengupload &amp; merender... proses bisa memakan waktu beberapa menit.", "running");

      try {
        const res = await fetch("/api/single-clip", { method: "POST", body: fd });
        const blob = await res.blob();
        if (!res.ok) {
          let msg = "Terjadi kesalahan.";
          try { msg = JSON.parse(await new Response(blob).text()).error || msg; } catch (_) {}
          log.textContent = msg;
          log.className = "log show";
          setStatus("Proses gagal.", "error");
          return;
        }
        const cd = res.headers.get("Content-Disposition") || "";
        const m = cd.match(/filename="?([^"]+)"?/);
        const name = m ? m[1] : "result.mp4";
        const url = URL.createObjectURL(blob);
        $("downloadLink").href = url;
        $("downloadLink").download = name;
        $("downloadBox").style.display = "block";
        setStatus("Selesai! Video hasil siap di-download.", "done");
      } catch (err) {
        setStatus("Gagal terhubung ke server: " + err.message, "error");
      } finally {
        $("submitBtn").disabled = false;
      }
    });
  </script>
</body>
</html>
